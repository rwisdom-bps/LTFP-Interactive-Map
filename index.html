        // Remove popup rows whose value cells are blank, null, or whitespace.
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            tempDiv.querySelectorAll('tr').forEach(function(row) {
                var cells = row.querySelectorAll('td');
                if (!cells.length) return;
                // For school popups, the first cell can be a label; remove the row
                // only when every data cell is empty.
                var hasValue = Array.from(cells).some(function(cell) {
                    return cell.textContent.trim() !== '';
                });
                if (!hasValue) row.remove();
            });
            return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}

        function style_Heatmap_Data_0(feature) {
            var rawCount = feature.properties['JOIN_COUNT'];
            var count = (rawCount === '' || rawCount === null || rawCount === undefined)
                ? NaN
                : Number(rawCount);
            var fillColor;
            if (!Number.isFinite(count)) {
                // Suppressed or missing count: neutral fill, no inferred category.
                fillColor = 'rgba(235,235,235,1.0)';
            } else if (count < 5) {
                fillColor = 'rgba(247,251,255,1.0)';
            } else if (count < 25) {
                fillColor = 'rgba(200,221,240,1.0)';
            } else if (count < 80) {
                fillColor = 'rgba(255,254,219,1.0)';
            } else if (count < 140) {
                fillColor = 'rgba(251,162,78,1.0)';
            } else {
                // Includes counts of 140 and above, including values above 415.
                fillColor = 'rgba(228,26,28,1.0)';
            }

            return {
                pane: 'pane_Heatmap_Data',
                opacity: 1,
                color: 'rgba(247,247,247,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: fillColor,
                interactive: false
            };
        }

		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }

            var isLayersListExpanded = true;

            // toggle Collapsed/Expanded and apply new Layers List height

                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen

                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');

        function filterFunc() {
          map.eachLayer(function(lyr){
          if ("options" in lyr && "dataVar" in lyr["options"]){
            features = this[lyr["options"]["dataVar"]].features.slice(0);
            try{
              for (key in Filters){
                keyS = key.replace(/[^a-zA-Z0-9_]/g, "")
                if (Filters[key] == "str" || Filters[key] == "bool"){
                  var selection = [];
                  var options = document.getElementById("sel_" + keyS).options
                  for (var i=0; i < options.length; i++) {
                    if (options[i].selected) selection.push(options[i].value);
                  }
                    try{
                      if (key in features[0].properties){
                        for (i = features.length - 1;
                          i >= 0; --i){
                          var propertyValue = features[i].properties[key];
                          propertyValue = propertyValue == null ? '' : String(propertyValue).trim();
                          var normalizedSelection = selection.map(function(value) { return String(value).trim(); });
                          if (normalizedSelection.indexOf(propertyValue) < 0
                          && normalizedSelection.length > 0) {
                          features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                  }
                }
                if (Filters[key] == "int"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (parseInt(features[i].properties[key])
                          < sliderVals[0]
                          || parseInt(features[i].properties[key])
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "real"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (features[i].properties[key]
                          < sliderVals[0]
                          || features[i].properties[key]
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "date"
                  || Filters[key] == "datetime"
                  || Filters[key] == "time"){
                  try{
                    if (key in features[0].properties){
                      HTMLkey = key.replace(/[&\/\\#,+()$~%.'":*?<>{} ]/g, '');
                      startdate = document.getElementById("dat_" +
                        HTMLkey + "_date1").value.replace(" ", "T");
                      enddate = document.getElementById("dat_" +
                        HTMLkey + "_date2").value.replace(" ", "T");
                      for (i = features.length - 1; i >= 0; --i){
                        if (features[i].properties[key] < startdate
                          || features[i].properties[key] > enddate){
                          features.splice(i,1);
                        }
                      }
                    }
                  } catch(err){
                  }
                }
              }
            } catch(err){
            }
          this[lyr["options"]["layerName"]].clearLayers();
          this[lyr["options"]["layerName"]].addData(features);
          }
          })
        }

            // Improve filter layout without changing the underlying filter logic.
            (function improveFilterControls() {
                var menu = document.getElementById('menu');
                if (!menu) return;

                function replaceWithClearButton(reset) {
                    if (!reset || reset.dataset.buttonized === 'true') return;
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'clear-filter-button';
                    button.textContent = 'Clear';
                    button.setAttribute('aria-label', 'Clear this filter');
                    button.addEventListener('click', function() {
                        if (typeof reset.onclick === 'function') reset.onclick.call(reset);
                    });
                    button.dataset.buttonized = 'true';
                    reset.replaceWith(button);
                }

                menu.querySelectorAll('.filterselect').forEach(function(group) {
                    var select = group.querySelector('select');
                    var labels = group.querySelectorAll('.filterlabel');
                    if (!select || labels.length < 2) return;
                    var title = labels[0];
                    var reset = labels[1];
                    var header = document.createElement('div');
                    header.className = 'filter-heading';
                    group.insertBefore(header, select);
                    header.appendChild(title);
                    title.classList.add('filter-title');
                    header.appendChild(reset);
                    replaceWithClearButton(reset);
                });

                menu.querySelectorAll('.slider').forEach(function(slider) {
                    if (slider.dataset.grouped === 'true') return;
                    var title = slider.nextElementSibling;
                    var reset = title && title.nextElementSibling;
                    if (!title || !reset || !title.classList.contains('filterlabel') ||
                        !reset.classList.contains('filterlabel')) return;

                    var wrapper = document.createElement('div');
                    wrapper.className = 'slider-filter';
                    slider.parentNode.insertBefore(wrapper, slider);
                    wrapper.appendChild(slider);
                    var header = document.createElement('div');
                    header.className = 'filter-heading';
                    wrapper.appendChild(header);
                    header.appendChild(title);
                    title.classList.add('filter-title');
                    header.appendChild(reset);
                    replaceWithClearButton(reset);
                    slider.dataset.grouped = 'true';
                });
            })();
        </script>
